name: CI

on:
  pull_request:
  push:
    branches: [main, Houcinemohamed]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check migrations are up to date
        run: |
          npm run db:generate
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "The schema changed without a committed migration."
            echo "Run 'npm run db:generate' locally and commit the drizzle/ folder."
            git status --porcelain drizzle
            exit 1
          fi
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the scan reads the whole git history
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      # Pinned to an exact version, built from source; Go's checksum database (left enabled)
      # verifies the module. The module still declares its old path (zricethezav), so the
      # gitleaks/gitleaks path is refused by Go for this version.
      - name: Install gitleaks v8.30.1
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Scan the repository
        run: >
          "$(go env GOPATH)/bin/gitleaks" git --config .gitleaks.toml --redact --no-banner
          --verbose --exit-code 1 .
