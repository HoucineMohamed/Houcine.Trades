name: CI

on:
  pull_request:
  push:
    branches: [main, Houcinemohamed]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check migrations are up to date
        run: |
          npm run db:generate
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "The schema changed without a committed migration."
            echo "Run 'npm run db:generate' locally and commit the drizzle/ folder."
            git status --porcelain drizzle
            exit 1
          fi
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
